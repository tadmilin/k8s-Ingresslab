# The edited summary is stored on this volume, so it survives Pod restarts.
# Both replicas mount it (ReadWriteOnce allows that on one node, as in minikube).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-research
  labels:
    app: app-research
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-research
  template:
    metadata:
      labels:
        app: app-research
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "/app/app.py"]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: code
          configMap:
            name: research-code   # generated by kustomization.yaml: app.py, common.py
        - name: seed
          configMap:
            name: research-seed   # first-start summary text: research.txt
        - name: data
          persistentVolumeClaim:
            claimName: research-data
---
apiVersion: v1
kind: Service
metadata:
  name: app-research
spec:
  selector:
    app: app-research
  ports:
    - port: 80
      targetPort: 8080
